<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chalk the Cue V2</title><style>
:root{--cream:#fff1c9;--coral:#ff6b4f;--red:#ef3f35;--cyan:#63edf0;--muted:#91a9ad;--line:#28525a;--display:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;--body:"Avenir Next",Avenir,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:30px 16px 70px;background:radial-gradient(circle at 12% 8%,#12363e,transparent 30%),radial-gradient(circle at 90% 22%,#4a1918,transparent 28%),#071014;color:var(--cream);font-family:var(--body)}main{width:min(100%,430px);margin:auto}.kicker{margin:0 0 5px;color:var(--coral);font:400 .78rem var(--display);letter-spacing:.14em}.title{margin:0;font:400 2.1rem/1 var(--display);text-shadow:3px 3px #8e211d}.intro{margin:9px 0 22px;color:var(--muted);font-size:.8rem}.demo{border:2px solid var(--line);padding:20px;background:linear-gradient(145deg,#102b32,#08151a);box-shadow:6px 6px #020607}.demo label{display:block;margin:12px 0;font-weight:700}.demo input{width:100%;margin-top:7px;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.05);color:var(--cream)}.start{width:100%;margin-top:14px;padding:16px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--coral),var(--red));color:var(--cream);font:400 1.08rem var(--display);letter-spacing:.05em;box-shadow:0 8px 25px rgba(239,63,53,.3)}.stage{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:rgba(4,11,14,.93);padding:25px}.stage.playing{display:grid}.animation-card{width:min(100%,360px);text-align:center}.animation-card p{margin:12px 0 0;color:var(--coral);font:400 1rem var(--display);letter-spacing:.14em}.animation-card small{display:block;margin-top:5px;color:var(--muted)}svg{width:100%;height:auto;overflow:visible}.cue{transform-origin:275px 87px;animation:cue-settle 1.55s ease-in-out both}.chalk{transform-origin:275px 80px;animation:chalk-twist 1.55s cubic-bezier(.45,.05,.35,1) both}.dust circle{opacity:0;animation:dust-pop 1.55s ease-out both}.dust circle:nth-child(2){animation-delay:.1s}.dust circle:nth-child(3){animation-delay:.2s}.shine{opacity:0;transform-origin:275px 86px;animation:shine .3s 1.25s ease-out forwards}@keyframes chalk-twist{0%{transform:translate(34px,-25px) rotate(20deg)}16%{transform:translate(2px,2px) rotate(-12deg)}32%{transform:translate(-7px,-1px) rotate(15deg)}48%{transform:translate(5px,3px) rotate(-17deg)}64%{transform:translate(-5px,0) rotate(14deg)}80%{transform:translate(3px,2px) rotate(-10deg)}100%{transform:translate(34px,-25px) rotate(20deg)}}@keyframes cue-settle{0%,100%{transform:rotate(-1deg)}20%,80%{transform:rotate(.7deg)}}@keyframes dust-pop{0%,18%{opacity:0;transform:translate(0,0)}40%{opacity:.9}75%{opacity:.35}100%{opacity:0;transform:translate(-17px,-23px)}}@keyframes shine{0%{opacity:0;transform:scale(.3) rotate(0)}55%{opacity:1}100%{opacity:0;transform:scale(1.2) rotate(35deg)}}@media(prefers-reduced-motion:reduce){.chalk,.cue,.dust circle,.shine{animation-duration:.01ms!important}}
</style></head><body><main><p class="kicker">DELIGHT LAB · V2</p><h1 class="title">Twist the Chalk</h1><p class="intro">The chalk face points down and twists around the cue tip.</p><section class="demo"><label>Series name<input value="Craft Cup"></label><label>Prize<input value="Loser makes the winner a craft"></label><button class="start" id="start">START SERIES</button></section></main><div class="stage" id="stage"><div class="animation-card"><svg viewBox="0 0 360 235" role="img" aria-label="Chalk twisting around a pool cue tip"><g class="cue"><path d="M28 203L126 157" stroke="#f4d8a1" stroke-width="20" stroke-linecap="round"/><path d="M28 203L126 157" stroke="#bd7640" stroke-width="12" stroke-linecap="round"/><path d="M126 157L257 96" stroke="#f7e7c2" stroke-width="12" stroke-linecap="round"/><path d="M255 97L275 87" stroke="#63edf0" stroke-width="13" stroke-linecap="round"/><path d="M271 89L280 85" stroke="#17333a" stroke-width="14" stroke-linecap="round"/></g><g class="chalk"><rect x="245" y="25" width="60" height="54" rx="8" fill="#174d58"/><path d="M245 34h60v43h-60z" fill="#2db4be"/><path d="M252 38h46v32h-46z" fill="#24949e" opacity=".55"/><ellipse cx="275" cy="78" rx="25" ry="10" fill="#63edf0"/><ellipse cx="275" cy="79" rx="12" ry="5" fill="#17333a"/></g><g class="dust" fill="#63edf0"><circle cx="258" cy="88" r="3"/><circle cx="278" cy="93" r="2.5"/><circle cx="291" cy="84" r="2"/></g><g class="shine" fill="#fff1c9"><path d="M275 72l3 10 10 3-10 3-3 10-3-10-10-3 10-3z"/></g></svg><p>RACK 'EM UP</p><small>Getting Craft Cup ready…</small></div></div><script>const stage=document.querySelector('#stage');document.querySelector('#start').onclick=()=>{stage.classList.remove('playing');void stage.offsetWidth;stage.classList.add('playing');setTimeout(()=>stage.classList.remove('playing'),1950)};</script></body></html>
