<!doctype html>
<!-- Final approved Neon Champion series-win animation; standalone. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Neon Champion · Series Win</title>
  <style>
    :root {
      --bg:#071014;
      --panel:#0b1b21;
      --line:#28525a;
      --cream:#fff1c9;
      --muted:#91a9ad;
      --coral:#ff6b4f;
      --cyan:#63edf0;
      --gold:#f3c552;
      --shadow:#020709;
      --display:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;
      --body:"Avenir Next",Avenir,sans-serif;
    }
    * { box-sizing:border-box; }
    body {
      min-height:100vh;
      margin:0;
      display:grid;
      place-items:center;
      padding:24px 14px;
      overflow-x:hidden;
      color:var(--cream);
      font-family:var(--body);
      background:
        radial-gradient(circle at 15% 0,rgba(39,104,112,.35),transparent 30%),
        radial-gradient(circle at 90% 20%,rgba(142,33,29,.32),transparent 30%),
        var(--bg);
    }
    main { width:min(100%,402px); }
    header { margin-bottom:14px; }
    .eyebrow { margin:0 0 5px; color:var(--coral); font:400 .76rem var(--display); letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; font:400 2rem/1 var(--display); letter-spacing:.045em; text-shadow:3px 3px 0 #8e211d; }
    .demo-card { overflow:hidden; border:2px solid var(--line); background:var(--panel); box-shadow:7px 7px 0 var(--shadow); }
    .demo-head { display:flex; align-items:center; justify-content:space-between; padding:11px 13px; border-bottom:1px solid rgba(255,255,255,.1); }
    .demo-head span { color:var(--muted); font-size:.72rem; }
    .replay { border:1px solid var(--line); border-radius:2px; padding:6px 9px; color:var(--cyan); background:transparent; font:700 .68rem var(--body); cursor:pointer; }
    .stage {
      position:relative;
      height:330px;
      overflow:hidden;
      background:
        linear-gradient(rgba(5,15,19,.45),rgba(5,15,19,.9)),
        repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.018) 3px 4px),
        radial-gradient(circle at 50% 42%,rgba(255,107,79,.12),transparent 42%),
        #09191e;
    }
    .cable { position:absolute; top:0; width:3px; height:78px; background:#25363a; transform-origin:top; }
    .cable.left { left:29%; transform:rotate(-7deg); }
    .cable.right { right:29%; transform:rotate(7deg); }
    .sign-wrap { position:absolute; left:24px; right:24px; top:58px; transform-origin:50% -58px; animation:sign-drop 1.05s cubic-bezier(.18,.72,.22,1) both; }
    .sign {
      position:relative;
      min-height:238px;
      display:grid;
      align-content:center;
      justify-items:center;
      padding:26px 15px 22px;
      border:7px solid #15262b;
      background:linear-gradient(180deg,#071014,#0a171c);
      box-shadow:0 0 0 2px #314950,8px 10px 0 var(--shadow),inset 0 0 38px rgba(0,0,0,.7);
    }
    .sign::before { content:""; position:absolute; inset:7px; border:2px solid #17333a; animation:border-power 2.05s .62s steps(1,end) both; }
    .bolt { position:absolute; width:7px; height:7px; border-radius:50%; background:#40565b; box-shadow:inset -2px -2px #17262a; }
    .bolt.tl { left:12px; top:12px; }
    .bolt.tr { right:12px; top:12px; }
    .bolt.bl { left:12px; bottom:12px; }
    .bolt.br { right:12px; bottom:12px; }
    .neon {
      position:relative;
      margin:0;
      color:transparent;
      text-align:center;
      text-transform:uppercase;
      opacity:.08;
      -webkit-text-fill-color:transparent;
      paint-order:stroke fill;
      text-shadow:none !important;
    }
    .winner-name { font:400 1.5rem/1 var(--display); letter-spacing:.14em; -webkit-text-stroke:1.15px #ffd6cc; animation:neon-coral-hollow 1.1s .72s steps(1,end) forwards; }
    .champion { margin-top:13px; font:400 2.08rem/.98 var(--display); letter-spacing:.075em; -webkit-text-stroke:1.35px #fffbe9; animation:neon-cream-hollow 1.2s 1.08s steps(1,end) forwards; }
    .score { margin-top:17px; font:400 1.72rem/1 var(--display); letter-spacing:.18em; -webkit-text-stroke:1.2px #dcffff; animation:neon-cyan-hollow 1.05s 1.5s steps(1,end) forwards; }
    .eight {
      position:absolute;
      isolation:isolate;
      left:50%;
      top:-25px;
      width:49px;
      height:49px;
      display:grid;
      place-items:center;
      border:3px solid #17333a;
      border-radius:50%;
      background:#061014;
      color:#071014;
      font:400 1.55rem/1 var(--display);
      opacity:0;
      transform:translateX(-50%) scale(.4);
      animation:eight-pop .52s 2.02s cubic-bezier(.2,.8,.2,1.25) forwards;
    }
    .eight::before { content:""; position:absolute; z-index:-1; left:50%; top:50%; width:29px; height:29px; border-radius:50%; background:var(--cream); transform:translate(-50%,-50%); box-shadow:inset -2px -2px 0 rgba(142,33,29,.13); }
    .surge { position:absolute; inset:-10px; border:3px solid var(--cream); opacity:0; pointer-events:none; animation:champion-surge .62s 2.14s ease-out both; }
    .spark { position:absolute; width:12px; height:12px; color:var(--cyan); font:400 1.2rem/1 var(--display); opacity:0; transform-origin:center; animation:spark-pop .6s ease-out both; }
    .spark.s1 { left:15px; top:76px; animation-delay:2.2s; }
    .spark.s2 { right:18px; top:44px; color:var(--gold); animation-delay:2.28s; }
    .spark.s3 { left:51px; bottom:19px; color:var(--coral); animation-delay:2.36s; }
    .spark.s4 { right:46px; bottom:13px; animation-delay:2.44s; }
    html.embed, .embed body { min-height:100%; background:#071014; color-scheme:dark; }
    .embed body { padding:0; }
    .embed main { width:100%; }
    .embed header, .embed .demo-head { display:none; }
    .embed .demo-card { border:0; background:transparent; box-shadow:none; }
    .embed .stage { height:330px; background:transparent; }
    @keyframes sign-drop {
      0% { opacity:0; transform:translateY(-185px) rotate(-7deg) scale(.9); }
      58% { opacity:1; transform:translateY(9px) rotate(2.6deg) scale(1); }
      73% { transform:translateY(-4px) rotate(-1.4deg); }
      86% { transform:translateY(2px) rotate(.55deg); }
      100% { opacity:1; transform:none; }
    }
    @keyframes border-power {
      0%,12%,21%,38% { border-color:#17333a; box-shadow:none; }
      13%,20%,39%,100% { border-color:var(--cyan); box-shadow:0 0 8px var(--cyan),inset 0 0 8px rgba(99,237,240,.25); }
    }
    @keyframes neon-coral-hollow {
      0%,16%,29%,46% { opacity:.08; filter:none; }
      17%,28%,47%,100% { opacity:1; filter:drop-shadow(0 0 2px var(--coral)) drop-shadow(0 0 5px rgba(255,107,79,.8)); }
    }
    @keyframes neon-cream-hollow {
      0%,12%,25%,42%,53% { opacity:.08; filter:none; }
      13%,24%,43%,52%,54%,100% { opacity:1; filter:drop-shadow(0 0 2px var(--cream)) drop-shadow(0 0 5px rgba(243,197,82,.72)); }
    }
    @keyframes neon-cyan-hollow {
      0%,15%,35%,49% { opacity:.08; filter:none; }
      16%,34%,50%,100% { opacity:1; filter:drop-shadow(0 0 2px var(--cyan)) drop-shadow(0 0 5px rgba(99,237,240,.72)); }
    }
    @keyframes eight-pop {
      0% { opacity:0; transform:translateX(-50%) scale(.35) rotate(-35deg); }
      68% { opacity:1; transform:translateX(-50%) scale(1.16) rotate(8deg); }
      100% { opacity:1; transform:translateX(-50%) scale(1) rotate(0); border-color:var(--cyan); box-shadow:0 0 10px var(--cyan),0 0 22px rgba(99,237,240,.45); }
    }
    @keyframes champion-surge { 0% { opacity:0; transform:scale(.93); } 30% { opacity:.9; } 100% { opacity:0; transform:scale(1.09); } }
    @keyframes spark-pop { 0% { opacity:0; transform:scale(.2) rotate(0); } 45% { opacity:1; transform:scale(1) rotate(18deg); } 100% { opacity:0; transform:scale(1.55) rotate(45deg); } }
    @media (prefers-reduced-motion:reduce) { * { animation-duration:.001ms !important; animation-delay:0s !important; } }
  </style>
</head>
<body>
  <main>
    <header><p class="eyebrow">Official series win animation</p><h1>Neon champion</h1></header>
    <section class="demo-card">
      <div class="demo-head"><span>Power surge championship sign</span><button class="replay" type="button">Replay</button></div>
      <div class="stage">
        <i class="cable left"></i><i class="cable right"></i>
        <div class="sign-wrap"><div class="sign">
          <i class="bolt tl"></i><i class="bolt tr"></i><i class="bolt bl"></i><i class="bolt br"></i>
          <div class="eight">8</div><div class="surge"></div>
          <span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✧</span><span class="spark s4">✦</span>
          <p class="neon winner-name">Vanessa</p>
          <p class="neon champion">Series champion</p>
          <p class="neon score">10 — 7</p>
        </div></div>
      </div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.has('embed')) document.documentElement.classList.add('embed');
    const winner = params.get('winner') || 'Vanessa';
    const vanessaScore = Number.parseInt(params.get('vanessaScore'),10);
    const carlScore = Number.parseInt(params.get('carlScore'),10);
    const safeVanessaScore = Number.isFinite(vanessaScore) ? vanessaScore : 10;
    const safeCarlScore = Number.isFinite(carlScore) ? carlScore : 7;
    document.querySelector('.winner-name').textContent = winner;
    document.querySelector('.score').textContent = `${safeVanessaScore} — ${safeCarlScore}`;
    document.title = `${winner} · Series Champion`;
    document.querySelector('.replay').addEventListener('click',() => {
      const oldStage = document.querySelector('.stage');
      const freshStage = oldStage.cloneNode(true);
      oldStage.replaceWith(freshStage);
    });
  </script>
</body>
</html>
