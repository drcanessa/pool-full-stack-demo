<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selected Add Round Layout</title>
  <style>
    :root{--cream:#fff1c9;--coral:#ff6b4f;--red:#ef3f35;--cyan:#63edf0;--muted:#91a9ad;--line:#28525a;--display:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;--body:"Avenir Next",Avenir,-apple-system,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:30px 16px 70px;background:radial-gradient(circle at 12% 8%,#12363e,transparent 30%),radial-gradient(circle at 90% 22%,#4a1918,transparent 28%),#071014;color:var(--cream);font-family:var(--body)}main{width:min(100%,560px);margin:auto}.page-kicker{margin:0 0 5px;color:var(--coral);font:400 .78rem var(--display);letter-spacing:.14em}.page-title{margin:0;font:400 2.2rem/1 var(--display);letter-spacing:.04em;text-shadow:3px 3px #8e211d}.intro{margin:9px 0 28px;color:var(--muted);font-size:.8rem}.label{margin:0 0 8px;color:var(--cyan);font:400 .75rem var(--display);letter-spacing:.12em}
    .card{position:relative;border:2px solid var(--line);padding:20px 18px 93px;background:linear-gradient(145deg,rgba(16,43,50,.98),rgba(8,21,26,.98));box-shadow:6px 6px #020607}.head{text-align:center}.eyebrow{margin:0 0 5px;color:var(--coral);font:400 .75rem var(--display);letter-spacing:.13em}.head h2{margin:0;font:400 1.7rem var(--display);letter-spacing:.04em}.date{margin:5px 0 0;color:var(--muted);font-size:.63rem}.round-log{display:flex;justify-content:center;gap:8px;margin:22px 0 19px}.ball{position:relative;width:29px;height:29px;display:grid;place-items:center;border:5px solid #17333a;border-radius:50%;font:400 .6rem var(--display);box-shadow:2px 2px #020607}.ball.v{background:var(--coral)}.ball.c{background:var(--cyan);color:#071014}.ball small{position:absolute;right:-4px;bottom:-5px;width:13px;height:13px;display:grid;place-items:center;border-radius:50%;background:#071014;color:var(--muted);font:400 .37rem var(--body)}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:19px 0;border-block:1px solid rgba(255,255,255,.12);text-align:center}.score b{display:block;font:400 2.8rem/1 var(--display);text-shadow:3px 3px #8e211d}.score span{display:block;margin-top:3px;color:var(--muted);font-size:.58rem}.score strong{color:var(--muted);font:400 .68rem/1.15 var(--display)}.prize{margin:16px 0 0;color:var(--cream);font-size:.74rem;line-height:1.35;text-align:center}.prize small{display:block;margin-bottom:4px;color:var(--muted);font-size:.53rem;letter-spacing:.1em}.dock{position:absolute;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:1fr 35px;gap:8px}.add{border:0;border-radius:15px;padding:17px 14px;background:linear-gradient(135deg,var(--coral),var(--red));color:var(--cream);font:400 1.08rem var(--display);letter-spacing:.045em;box-shadow:0 8px 25px rgba(239,63,53,.3)}.edit{display:grid;place-items:center;border:1px solid #31545c;background:#0a1b20;color:#fff}.edit svg{width:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  </style>
</head>
<body><main><p class="page-kicker">SELECTED DIRECTION</p><h1 class="page-title">Docked Add Round</h1><p class="intro">Option 4 with the Prize centered.</p><p class="label">V3 · CENTERED PRIZE</p><article class="card"><div class="head"><p class="eyebrow">FIRST TO 10</p><h2>Bar Crawl Cup</h2><p class="date">Started Aug 1, 2026</p></div><div class="round-log"><i class="ball c">C<small>1</small></i><i class="ball v">V<small>2</small></i><i class="ball c">C<small>3</small></i><i class="ball v">V<small>4</small></i><i class="ball c">C<small>5</small></i></div><div class="score"><div><b>2</b><span>VANESSA</span></div><strong>FIRST TO<br>10</strong><div><b>3</b><span>CARL</span></div></div><p class="prize"><small>PRIZE</small>Winner picks the next bar</p><div class="dock"><button class="add">+ ADD ROUND</button><button class="edit" aria-label="Edit series"><svg viewBox="0 0 24 24"><path d="M4 20h4l11-11-4-4L4 16v4Z"/></svg></button></div></article></main></body>
</html>
