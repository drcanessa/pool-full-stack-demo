<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vanessa avatar options</title><style>
:root{--bg:#071014;--panel:#0b1b21;--cream:#fff1c9;--coral:#ff6b4f;--cyan:#63edf0;--muted:#91a9ad;--red:#8e211d}*{box-sizing:border-box}body{margin:0;padding:30px 16px 60px;background:radial-gradient(circle at 15% 0,#153b43,transparent 30%),var(--bg);color:var(--cream);font-family:"Avenir Next",sans-serif}main{width:min(100%,402px);margin:auto}h1,h2,p{margin-top:0}h1,h2{font-family:Impact,sans-serif;font-weight:400;letter-spacing:.045em}h1{margin-bottom:8px;font-size:2rem;text-shadow:3px 3px var(--red)}.intro{color:var(--muted);font-size:.8rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}.card{padding:14px 10px;border:2px solid #28525a;background:var(--panel);text-align:center;box-shadow:4px 4px #020607}.card.current{border-color:var(--coral)}.avatar{width:88px;height:88px;margin:auto;overflow:hidden;border:4px solid #704034;background:#ef3f35;image-rendering:pixelated}.avatar img{width:100%;height:100%;display:block;object-fit:cover;image-rendering:pixelated}.current .avatar img{transform:translateY(5%) scale(1.3);transform-origin:50% 38%}.card h2{margin:11px 0 4px;font-size:.95rem}.card p{margin:0;color:var(--muted);font-size:.62rem}.current p{color:var(--coral)}.actual{margin-top:30px;padding:16px;border:2px solid #28525a;background:var(--panel);text-align:center}.actual h2{font-size:1rem}.actual-row{display:flex;justify-content:center;gap:14px}.actual .avatar{width:68px;height:68px}.actual small{display:block;margin-top:10px;color:var(--muted)}
