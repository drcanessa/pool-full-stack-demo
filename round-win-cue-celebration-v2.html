<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cue Celebration · Round Win V2</title>
  <style>
    :root{--bg:#071014;--panel:#0b1b21;--line:#28525a;--cream:#fff1c9;--muted:#91a9ad;--coral:#ff6b4f;--cyan:#63edf0;--blue:#2db4be;--wood:#bd7640;--shadow:#020709;--display:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;--body:"Avenir Next",Avenir,sans-serif}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px 14px;overflow-x:hidden;color:var(--cream);font-family:var(--body);background:radial-gradient(circle at 15% 0,rgba(39,104,112,.35),transparent 30%),radial-gradient(circle at 90% 20%,rgba(142,33,29,.32),transparent 30%),var(--bg)}
    main{width:min(100%,402px)}header{margin-bottom:14px}.eyebrow{margin:0 0 5px;color:var(--coral);font:400 .76rem var(--display);letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font:400 2rem/1 var(--display);letter-spacing:.045em;text-shadow:3px 3px 0 #8e211d}.demo-card{overflow:hidden;border:2px solid var(--line);background:var(--panel);box-shadow:7px 7px 0 var(--shadow)}.demo-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid rgba(255,255,255,.1)}.demo-head span{color:var(--muted);font-size:.72rem}.replay{border:1px solid var(--line);border-radius:2px;padding:6px 9px;color:var(--cyan);background:transparent;font:700 .68rem var(--body);cursor:pointer}.stage{position:relative;height:330px;overflow:hidden;background:linear-gradient(rgba(5,15,19,.52),rgba(5,15,19,.88)),repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.018) 3px 4px),radial-gradient(circle at 50% 38%,rgba(45,180,190,.14),transparent 34%),#09191e}.cue-art{position:absolute;inset:16px 0 auto;width:100%;height:auto}.cue-left,.cue-right{transform-box:view-box}.cue-left{transform-origin:88px 177px;animation:left-clap 1.35s .15s cubic-bezier(.2,.72,.24,1) both}.cue-right{transform-origin:272px 177px;animation:right-clap 1.35s .15s cubic-bezier(.2,.72,.24,1) both}.dust-core,.dust-speck,.impact-star{opacity:0;transform-box:fill-box;transform-origin:center}.dust-core{animation:dust-puff .72s .91s ease-out both}.dust-speck{animation:dust-speck .78s ease-out both}.dust-speck.s1{animation-delay:.91s}.dust-speck.s2{animation-delay:.97s}.dust-speck.s3{animation-delay:1.02s}.dust-speck.s4{animation-delay:1.07s}.dust-speck.s5{animation-delay:1.1s}.impact-star{animation:impact-pop .42s .88s ease-out both}.winner-copy{position:absolute;left:16px;right:16px;bottom:28px;text-align:center;opacity:0;transform:translateY(9px);animation:winner-in .42s 1.52s ease-out forwards}.winner-copy strong{display:block;color:var(--cream);font:400 1.75rem/1 var(--display);letter-spacing:.055em;text-transform:uppercase;text-shadow:3px 3px 0 #8e211d,0 0 15px rgba(99,237,240,.3)}.winner-copy span{display:block;margin-top:7px;color:var(--cyan);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
    @keyframes left-clap{0%{transform:translate(-120px,38px) rotate(-11deg)}58%{transform:translate(0,0) rotate(0)}67%{transform:translate(8px,-5px) rotate(2.4deg)}76%{transform:translate(-3px,2px) rotate(-1deg)}86%{transform:translate(2px,-1px) rotate(.5deg)}100%{transform:none}}
    @keyframes right-clap{0%{transform:translate(120px,38px) rotate(11deg)}58%{transform:translate(0,0) rotate(0)}67%{transform:translate(-8px,-5px) rotate(-2.4deg)}76%{transform:translate(3px,2px) rotate(1deg)}86%{transform:translate(-2px,-1px) rotate(-.5deg)}100%{transform:none}}
    @keyframes dust-puff{0%{opacity:0;transform:scale(.12)}28%{opacity:.82;transform:scale(.7)}68%{opacity:.42;transform:scale(1.25)}100%{opacity:0;transform:scale(1.7)}}@keyframes dust-speck{0%{opacity:0;transform:translate(0,0) scale(.4)}28%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.15)}}@keyframes impact-pop{0%{opacity:0;transform:scale(.15) rotate(0)}45%{opacity:1;transform:scale(1) rotate(14deg)}100%{opacity:0;transform:scale(1.45) rotate(34deg)}}@keyframes winner-in{to{opacity:1;transform:none}}.embed body{min-height:100%;padding:0;background:transparent}.embed main{width:100%}.embed header,.embed .demo-head{display:none}.embed .demo-card{border:0;background:transparent;box-shadow:none}.embed .stage{height:330px;background:transparent}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-delay:0s!important}}
    html.embed,.embed body,.embed .demo-card,.embed .stage{background:#071014;color-scheme:dark}
  </style>
</head>
<body><main><header><p class="eyebrow">Round win · Animation 3 · V2</p><h1>Cue celebration</h1></header><section class="demo-card"><div class="demo-head"><span>Cross · clap · chalk puff</span><button class="replay" type="button">Replay</button></div><div class="stage"><svg class="cue-art" viewBox="0 0 360 230" role="img" aria-label="Two pool cues cross, clap together, and release a puff of blue chalk dust">
    <g class="cue-left"><path d="M43 190L235 48" stroke="#704226" stroke-width="17" stroke-linecap="round"/><path d="M51 184L226 55" stroke="#bd7640" stroke-width="11" stroke-linecap="round"/><path d="M183 87L226 55" stroke="#f7e7c2" stroke-width="8" stroke-linecap="round"/><path d="M226 55L235 48" stroke="#63edf0" stroke-width="8" stroke-linecap="round"/></g>
    <g class="cue-right"><path d="M317 190L125 48" stroke="#704226" stroke-width="17" stroke-linecap="round"/><path d="M309 184L134 55" stroke="#bd7640" stroke-width="11" stroke-linecap="round"/><path d="M177 87L134 55" stroke="#f7e7c2" stroke-width="8" stroke-linecap="round"/><path d="M134 55L125 48" stroke="#63edf0" stroke-width="8" stroke-linecap="round"/></g>
    <g fill="#2db4be"><g class="dust-core"><circle cx="171" cy="89" r="16" opacity=".68"/><circle cx="187" cy="84" r="19" opacity=".52"/><circle cx="183" cy="98" r="13" opacity=".45"/><circle cx="163" cy="79" r="9" opacity=".38"/></g><circle class="dust-speck s1" style="--dx:-38px;--dy:-28px" cx="180" cy="88" r="5"/><circle class="dust-speck s2" style="--dx:34px;--dy:-35px" cx="180" cy="88" r="4"/><circle class="dust-speck s3" style="--dx:-49px;--dy:7px" cx="180" cy="88" r="3.5"/><circle class="dust-speck s4" style="--dx:47px;--dy:10px" cx="180" cy="88" r="5"/><circle class="dust-speck s5" style="--dx:5px;--dy:-49px" cx="180" cy="88" r="3"/></g><path class="impact-star" d="M180 61l4 14 14 4-14 4-4 14-4-14-14-4 14-4z" fill="#fff1c9"/>
  </svg><div class="winner-copy"><strong>Cues up for Carl!</strong><span>Clack · chalk · victory</span></div></div></section></main><script>const params=new URLSearchParams(location.search);if(params.has('embed'))document.documentElement.classList.add('embed');const winner=params.get('winner');if(winner)document.querySelector('.winner-copy strong').textContent=`Cues up for ${winner}!`;document.querySelector('.replay').addEventListener('click',()=>{const old=document.querySelector('.stage');const fresh=old.cloneNode(true);old.replaceWith(fresh)});</script></body>
</html>
