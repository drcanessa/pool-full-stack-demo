<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send the Cue Ball V1</title><style>
:root{--cream:#fff1c9;--coral:#ff6b4f;--red:#ef3f35;--cyan:#63edf0;--muted:#91a9ad;--line:#28525a;--display:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;--body:"Avenir Next",Avenir,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:30px 16px 70px;background:radial-gradient(circle at 12% 8%,#12363e,transparent 30%),radial-gradient(circle at 90% 22%,#4a1918,transparent 28%),#071014;color:var(--cream);font-family:var(--body)}main{width:min(100%,430px);margin:auto}.kicker{margin:0 0 5px;color:var(--coral);font:400 .78rem var(--display);letter-spacing:.14em}.title{margin:0;font:400 2.1rem/1 var(--display);text-shadow:3px 3px #8e211d}.intro{margin:9px 0 22px;color:var(--muted);font-size:.8rem}.demo{border:2px solid var(--line);padding:20px;background:linear-gradient(145deg,#102b32,#08151a);box-shadow:6px 6px #020607}.demo label{display:block;margin:12px 0;font-weight:700}.demo input{width:100%;margin-top:7px;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.05);color:var(--cream)}.start{width:100%;margin-top:14px;padding:16px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--coral),var(--red));color:var(--cream);font:400 1.08rem var(--display);letter-spacing:.05em;box-shadow:0 8px 25px rgba(239,63,53,.3)}.stage{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:rgba(4,11,14,.93);padding:25px}.stage.playing{display:grid}.animation-card{width:min(100%,360px);text-align:center}.animation-card p{margin:8px 0 0;color:var(--coral);font:400 1rem var(--display);letter-spacing:.14em}.animation-card small{display:block;margin-top:5px;color:var(--muted)}svg{width:100%;height:auto;overflow:hidden}.cue{transform-origin:142px 126px;animation:cue-strike 1.45s cubic-bezier(.4,0,.25,1) both}.cue-ball{transform-origin:160px 126px;animation:ball-roll 1.45s cubic-bezier(.22,.72,.18,1) both}.impact{opacity:0;transform-origin:139px 126px;animation:impact .25s .43s ease-out both}.speed-lines{opacity:0;animation:speed-lines .75s .52s ease-out both}@keyframes cue-strike{0%{transform:translateX(-42px)}30%{transform:translateX(-7px)}38%{transform:translateX(2px)}49%{transform:translateX(-11px)}100%{transform:translateX(-17px)}}@keyframes ball-roll{0%,38%{transform:translateX(0) rotate(0)}55%{transform:translateX(45px) rotate(100deg)}78%{transform:translateX(112px) rotate(260deg)}100%{transform:translateX(172px) rotate(420deg)}}@keyframes impact{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1}100%{opacity:0;transform:scale(1.3) rotate(35deg)}}@keyframes speed-lines{0%{opacity:0;transform:translateX(-8px)}25%{opacity:.8}100%{opacity:0;transform:translateX(90px)}}@media(prefers-reduced-motion:reduce){.cue,.cue-ball,.impact,.speed-lines{animation-duration:.01ms!important}}
</style></head><body><main><p class="kicker">DELIGHT LAB · INTRO 3</p><h1 class="title">Send the Cue Ball</h1><p class="intro">The cue strikes, recoils, and sends the ball rolling away.</p><section class="demo"><label>Series name<input value="Craft Cup"></label><label>Prize<input value="Loser makes the winner a craft"></label><button class="start" id="start">START SERIES</button></section></main><div class="stage" id="stage"><div class="animation-card"><svg viewBox="0 0 360 220" role="img" aria-label="A pool cue striking a cue ball that rolls away"><path d="M22 151H338" stroke="#17333a" stroke-width="6" stroke-linecap="round"/><g class="cue"><path d="M18 126H127" stroke="#bd7640" stroke-width="18" stroke-linecap="round"/><path d="M18 126H127" stroke="#f4d8a1" stroke-width="9" stroke-linecap="round"/><path d="M125 126H141" stroke="#63edf0" stroke-width="11" stroke-linecap="round"/><path d="M138 126H145" stroke="#17333a" stroke-width="12" stroke-linecap="round"/></g><g class="speed-lines" fill="none" stroke="#63edf0" stroke-width="3" stroke-linecap="round"><path d="M154 101h18M147 111h29M151 141h22"/></g><g class="cue-ball"><circle cx="166" cy="126" r="27" fill="#fff1c9"/><path d="M151 112c7-7 17-9 25-5" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M179 145c6-3 10-8 12-14" fill="none" stroke="#d9c9a5" stroke-width="5" stroke-linecap="round"/></g><g class="impact" fill="#ff6b4f"><path d="M142 108l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/></g></svg><p>BREAK TIME</p><small>Getting Craft Cup ready…</small></div></div><script>const stage=document.querySelector('#stage');document.querySelector('#start').onclick=()=>{stage.classList.remove('playing');void stage.offsetWidth;stage.classList.add('playing');setTimeout(()=>stage.classList.remove('playing'),1850)};</script></body></html>
