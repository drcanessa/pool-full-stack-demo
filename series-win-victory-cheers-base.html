<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Victory Cheers · Internal Animation Base</title>
  <style>
    :root{--bg:#071014;--panel:#0b1b21;--line:#28525a;--cream:#fff1c9;--foam:#fffaf0;--muted:#91a9ad;--coral:#ff6b4f;--cyan:#63edf0;--shadow:#020709;--display:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;--body:"Avenir Next",Avenir,sans-serif;--foam-font:"Arial Rounded MT Bold","Trebuchet MS",sans-serif}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px 14px;overflow-x:hidden;color:var(--cream);font-family:var(--body);background:radial-gradient(circle at 12% 0,rgba(39,104,112,.35),transparent 30%),radial-gradient(circle at 90% 18%,rgba(142,33,29,.31),transparent 30%),var(--bg)}main{width:min(100%,402px)}header{margin-bottom:14px}.eyebrow{margin:0 0 5px;color:var(--coral);font:400 .76rem var(--display);letter-spacing:.16em;text-transform:uppercase}h1{margin:0;font:400 2rem/1 var(--display);letter-spacing:.045em;text-shadow:3px 3px 0 #8e211d}.demo-card{overflow:hidden;border:2px solid var(--line);background:var(--panel);box-shadow:7px 7px 0 var(--shadow)}.demo-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid rgba(255,255,255,.1)}.demo-head span{min-width:0;color:var(--muted);font-size:.72rem}.replay{flex:none;border:1px solid var(--line);border-radius:2px;padding:6px 9px;color:var(--cyan);background:transparent;font:700 .68rem var(--body);cursor:pointer}.stage{position:relative;height:365px;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 43%,rgba(99,237,240,.13),transparent 40%),repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.015) 3px 4px),linear-gradient(180deg,#0a1b20,#071014 78%)}
    .champion-lockup{position:absolute;z-index:18;left:4px;right:4px;top:18px;height:105px;text-align:center;opacity:0;transform:translateY(-15px) scale(.92);animation:title-land .7s 1.07s cubic-bezier(.18,.82,.22,1.16) forwards}.foam-type{display:block;width:100%;height:58px;overflow:visible}.foam-core,.foam-beads{text-anchor:middle;font-family:var(--foam-font);font-weight:900;fill:var(--foam);stroke:var(--foam);stroke-linejoin:round}.foam-core{stroke-width:1.1px;filter:url(#gentle-wobble)}.foam-beads{fill:none;stroke-width:3.1px;stroke-dasharray:.1 7.4;stroke-linecap:round;opacity:.82;filter:url(#gentle-wobble)}.champion{font-size:29px;letter-spacing:1px}.winner-name{margin:0;color:var(--coral);font:400 1.25rem/1 var(--display);letter-spacing:.17em;text-transform:uppercase;text-shadow:2px 2px 0 #8e211d}.winner-name::before,.winner-name::after{content:"✦";margin:0 8px;color:var(--cyan);font-size:.65em;text-shadow:none}
    .pint{position:absolute;z-index:7;top:145px;width:82px;height:126px;filter:drop-shadow(6px 7px 0 rgba(0,0,0,.55));transform-origin:50% 88%}.pint.left{left:calc(50% - 132px);transform:translateX(-120px) rotate(-15deg);animation:left-clink 1.28s .12s cubic-bezier(.2,.82,.22,1) both}.pint.right{right:calc(50% - 132px);transform:translateX(120px) rotate(15deg);animation:right-clink 1.28s .12s cubic-bezier(.2,.82,.22,1) both}.glass{position:absolute;inset:0;overflow:hidden;border:4px solid #b8d4d6;border-top-width:3px;clip-path:polygon(7% 0,93% 0,84% 100%,16% 100%);background:rgba(154,210,211,.12)}.beer{position:absolute;left:5px;right:5px;bottom:4px;height:82%;background:linear-gradient(90deg,#b96712,#f2b844 36%,#d78d1d 78%,#a6550e);box-shadow:inset 8px 0 rgba(255,241,201,.15),inset -8px 0 rgba(91,42,10,.2)}.foam{position:absolute;z-index:2;left:4px;right:4px;top:12px;height:25px;background:var(--foam);border-bottom:3px solid #dfc889}.foam::before{content:"";position:absolute;left:-3px;top:-10px;width:29px;height:24px;border-radius:50%;background:var(--foam);box-shadow:24px 4px 0 2px var(--foam),47px -1px 0 -1px var(--foam)}.foam::after{content:"";position:absolute;right:8px;top:15px;width:11px;height:19px;border-radius:0 0 7px 7px;background:var(--foam)}.shine{position:absolute;z-index:4;left:16px;top:41px;width:6px;height:39px;background:rgba(255,255,255,.37)}.score{position:absolute;z-index:6;left:50%;top:48px;color:var(--cream);font:400 2.25rem/1 var(--display);-webkit-text-stroke:1px #6f3a15;text-shadow:3px 3px 0 rgba(77,34,11,.72);transform:translateX(-50%)}.clink-star{position:absolute;z-index:15;left:50%;top:174px;color:var(--cyan);font-size:1.8rem;opacity:0;transform:translate(-50%,-50%);animation:star-pop .46s 1.02s ease-out both}.splash{position:absolute;z-index:14;left:50%;top:129px;width:98px;height:72px;transform:translateX(-50%);opacity:0;animation:splash-pop .58s 1.06s ease-out both}.splash i{position:absolute;display:block;border-radius:50%;background:var(--foam)}.splash i:nth-child(1){left:44px;top:34px;width:11px;height:22px;transform:rotate(-20deg)}.splash i:nth-child(2){left:22px;top:14px;width:8px;height:18px;transform:rotate(-38deg)}.splash i:nth-child(3){right:20px;top:10px;width:8px;height:19px;transform:rotate(35deg)}.splash i:nth-child(4){left:7px;top:40px;width:7px;height:7px}.splash i:nth-child(5){right:6px;top:37px;width:9px;height:9px}.bar{position:absolute;z-index:3;left:0;right:0;top:306px;height:31px;border-top:5px solid #9a5b3c;background:repeating-linear-gradient(90deg,#5b3024 0 46px,#6b3828 46px 49px);box-shadow:0 7px 0 #020709}.final-score{position:absolute;z-index:17;left:0;right:0;bottom:8px;margin:0;color:var(--muted);text-align:center;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:0;animation:label-in .4s 1.62s ease-out forwards}
    .embed body{min-height:100%;padding:0;background:transparent}.embed main{width:100%}.embed header,.embed .demo-head{display:none}.embed .demo-card{border:0;background:transparent;box-shadow:none}.embed .stage{height:365px;background:transparent}@keyframes left-clink{0%{transform:translateX(-120px) rotate(-15deg)}63%{transform:translate(39px,-7px) rotate(8deg)}75%{transform:translate(31px,-4px) rotate(5deg)}100%{transform:translate(7px,0) rotate(2deg)}}@keyframes right-clink{0%{transform:translateX(120px) rotate(15deg)}63%{transform:translate(-39px,-7px) rotate(-8deg)}75%{transform:translate(-31px,-4px) rotate(-5deg)}100%{transform:translate(-7px,0) rotate(-2deg)}}@keyframes splash-pop{0%{opacity:0;transform:translateX(-50%) scale(.25)}35%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-31px) scale(1.1)}}@keyframes star-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}46%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(18deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6) rotate(45deg)}}@keyframes title-land{0%{opacity:0;transform:translateY(-15px) scale(.92)}62%{opacity:1;transform:translateY(2px) scale(1.02)}100%{opacity:1;transform:none}}@keyframes label-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media(max-width:380px){.champion{font-size:25px}.pint{width:76px;height:119px}.pint.left{left:calc(50% - 122px)}.pint.right{right:calc(50% - 122px)}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-delay:0s!important}}
    html.embed,.embed body,.embed .demo-card,.embed .stage{background:#071014;color-scheme:dark}
  </style>
</head>
<body>
  <main>
    <header><p class="eyebrow">Series win prototype · V5</p><h1>Victory cheers</h1></header>
    <section class="demo-card">
      <div class="demo-head"><span>Readable foam lettering + a lighter glass tap</span><button class="replay" type="button">Replay</button></div>
      <div class="stage">
        <div class="champion-lockup">
          <svg class="foam-type" viewBox="0 0 360 58" role="img" aria-label="Series Champion">
            <defs><filter id="gentle-wobble" x="-5%" y="-10%" width="110%" height="125%"><feTurbulence type="fractalNoise" baseFrequency=".018 .055" numOctaves="1" seed="9" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale=".85" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
            <text class="foam-beads champion" x="180" y="40">SERIES CHAMPION</text><text class="foam-core champion" x="180" y="40">SERIES CHAMPION</text>
          </svg>
          <p class="winner-name">Vanessa</p>
        </div>
        <div class="splash"><i></i><i></i><i></i><i></i><i></i></div><div class="clink-star">✦</div>
        <div class="pint left"><div class="glass"><div class="beer"></div><div class="foam"></div><i class="shine"></i><span class="score left-score">10</span></div></div>
        <div class="pint right"><div class="glass"><div class="beer"></div><div class="foam"></div><i class="shine"></i><span class="score right-score">7</span></div></div>
        <div class="bar"></div><p class="final-score">Final score · <span class="scoreline">10—7</span></p>
      </div>
    </section>
  </main>
  <script>
    const params=new URLSearchParams(location.search);if(params.has('embed'))document.documentElement.classList.add('embed');const winner=params.get('winner')||'Vanessa';const v=Number.parseInt(params.get('vanessaScore'),10);const c=Number.parseInt(params.get('carlScore'),10);const scores={vanessa:Number.isFinite(v)?v:10,carl:Number.isFinite(c)?c:7};document.querySelector('.left-score').textContent=scores.vanessa;document.querySelector('.right-score').textContent=scores.carl;document.querySelector('.winner-name').textContent=winner;document.querySelector('.scoreline').textContent=`${scores.vanessa}—${scores.carl}`;document.title=`${winner} · Victory Cheers`;document.querySelector('.replay').addEventListener('click',()=>{const old=document.querySelector('.stage');old.replaceWith(old.cloneNode(true))});
  </script>
</body>
</html>
