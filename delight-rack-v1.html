<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rack the Balls V1</title><style>
:root{--cream:#fff1c9;--coral:#ff6b4f;--red:#ef3f35;--cyan:#63edf0;--muted:#91a9ad;--line:#28525a;--display:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;--body:"Avenir Next",Avenir,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:30px 16px 70px;background:radial-gradient(circle at 12% 8%,#12363e,transparent 30%),radial-gradient(circle at 90% 22%,#4a1918,transparent 28%),#071014;color:var(--cream);font-family:var(--body)}main{width:min(100%,430px);margin:auto}.kicker{margin:0 0 5px;color:var(--coral);font:400 .78rem var(--display);letter-spacing:.14em}.title{margin:0;font:400 2.1rem/1 var(--display);text-shadow:3px 3px #8e211d}.intro{margin:9px 0 22px;color:var(--muted);font-size:.8rem}.demo{border:2px solid var(--line);padding:20px;background:linear-gradient(145deg,#102b32,#08151a);box-shadow:6px 6px #020607}.demo label{display:block;margin:12px 0;font-weight:700}.demo input{width:100%;margin-top:7px;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.05);color:var(--cream)}.start{width:100%;margin-top:14px;padding:16px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--coral),var(--red));color:var(--cream);font:400 1.08rem var(--display);letter-spacing:.05em;box-shadow:0 8px 25px rgba(239,63,53,.3)}.stage{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:rgba(4,11,14,.93);padding:25px}.stage.playing{display:grid}.animation-card{width:min(100%,360px);text-align:center}.animation-card p{margin:12px 0 0;color:var(--coral);font:400 1rem var(--display);letter-spacing:.14em}.animation-card small{display:block;margin-top:5px;color:var(--muted)}svg{width:100%;height:auto;overflow:visible}.rack{transform-origin:180px 130px;animation:rack-nudge 1.5s cubic-bezier(.45,.05,.35,1) both}.balls{transform-origin:180px 130px;animation:balls-settle 1.5s ease-in-out both}.balls circle:nth-child(2n){animation:tiny-jiggle 1.5s ease-in-out both}.settle-lines{opacity:0;animation:settle-lines .35s 1.15s ease-out forwards}.spark{opacity:0;transform-origin:180px 52px;animation:spark .32s 1.25s ease-out forwards}@keyframes rack-nudge{0%{transform:translateX(-25px)}18%{transform:translateX(8px)}37%{transform:translateX(-10px)}56%{transform:translateX(6px)}75%{transform:translateX(-4px)}100%{transform:translateX(0)}}@keyframes balls-settle{0%{transform:translateX(-7px) scale(.98)}18%{transform:translateX(4px) scale(1.01)}37%{transform:translateX(-3px)}56%{transform:translateX(2px)}100%{transform:translateX(0) scale(1)}}@keyframes tiny-jiggle{0%,100%{transform:translate(0)}18%{transform:translate(2px,-1px)}37%{transform:translate(-1px,1px)}56%{transform:translate(1px,0)}}@keyframes settle-lines{0%{opacity:0;transform:scale(.7)}45%{opacity:.8}100%{opacity:0;transform:scale(1.15)}}@keyframes spark{0%{opacity:0;transform:scale(.3) rotate(0)}55%{opacity:1}100%{opacity:0;transform:scale(1.2) rotate(35deg)}}@media(prefers-reduced-motion:reduce){.rack,.balls,.balls circle,.settle-lines,.spark{animation-duration:.01ms!important}}
</style></head><body><main><p class="kicker">DELIGHT LAB · INTRO 2</p><h1 class="title">Rack 'Em Tight</h1><p class="intro">The rack nudges the balls together, then settles them into place.</p><section class="demo"><label>Series name<input value="Craft Cup"></label><label>Prize<input value="Loser makes the winner a craft"></label><button class="start" id="start">START SERIES</button></section></main><div class="stage" id="stage"><div class="animation-card"><svg viewBox="0 0 360 240" role="img" aria-label="A triangle rack nudging pool balls into place"><path d="M40 211h280" stroke="#17333a" stroke-width="5" stroke-linecap="round"/><g class="balls" stroke="#071014" stroke-width="4"><circle cx="180" cy="65" r="18" fill="#fff1c9"/><circle cx="159" cy="101" r="18" fill="#ff6b4f"/><circle cx="201" cy="101" r="18" fill="#63edf0"/><circle cx="138" cy="137" r="18" fill="#63edf0"/><circle cx="180" cy="137" r="18" fill="#071014" stroke="#fff1c9"/><circle cx="222" cy="137" r="18" fill="#ff6b4f"/><circle cx="117" cy="173" r="18" fill="#fff1c9"/><circle cx="159" cy="173" r="18" fill="#ef3f35"/><circle cx="201" cy="173" r="18" fill="#fff1c9"/><circle cx="243" cy="173" r="18" fill="#63edf0"/></g><g class="rack" fill="none" stroke-linejoin="round"><path d="M180 36L88 199H272Z" stroke="#bd7640" stroke-width="18"/><path d="M180 36L88 199H272Z" stroke="#f4d8a1" stroke-width="7"/></g><g class="settle-lines" fill="none" stroke="#63edf0" stroke-width="3" stroke-linecap="round"><path d="M77 109h-18M83 132H69M283 109h18M277 132h14"/></g><g class="spark" fill="#fff1c9"><path d="M180 32l3 10 10 3-10 3-3 10-3-10-10-3 10-3z"/></g></svg><p>RACK 'EM UP</p><small>Getting Craft Cup ready…</small></div></div><script>const stage=document.querySelector('#stage');document.querySelector('#start').onclick=()=>{stage.classList.remove('playing');void stage.offsetWidth;stage.classList.add('playing');setTimeout(()=>stage.classList.remove('playing'),1900)};</script></body></html>
