<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chalk the Cue Delight</title>
  <style>
    :root{--cream:#fff1c9;--coral:#ff6b4f;--red:#ef3f35;--cyan:#63edf0;--muted:#91a9ad;--line:#28525a;--display:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;--body:"Avenir Next",Avenir,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:30px 16px 70px;background:radial-gradient(circle at 12% 8%,#12363e,transparent 30%),radial-gradient(circle at 90% 22%,#4a1918,transparent 28%),#071014;color:var(--cream);font-family:var(--body)}main{width:min(100%,430px);margin:auto}.kicker{margin:0 0 5px;color:var(--coral);font:400 .78rem var(--display);letter-spacing:.14em}.title{margin:0;font:400 2.1rem/1 var(--display);text-shadow:3px 3px #8e211d}.intro{margin:9px 0 22px;color:var(--muted);font-size:.8rem}.demo{border:2px solid var(--line);padding:20px;background:linear-gradient(145deg,#102b32,#08151a);box-shadow:6px 6px #020607}.demo label{display:block;margin:12px 0;color:var(--cream);font-weight:700}.demo input{width:100%;margin-top:7px;padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.05);color:var(--cream)}.start{width:100%;margin-top:14px;padding:16px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--coral),var(--red));color:var(--cream);font:400 1.08rem var(--display);letter-spacing:.05em;box-shadow:0 8px 25px rgba(239,63,53,.3)}.stage{position:fixed;inset:0;z-index:5;display:none;place-items:center;background:rgba(4,11,14,.93);padding:25px}.stage.playing{display:grid}.animation-card{width:min(100%,360px);text-align:center}.animation-card p{margin:15px 0 0;color:var(--coral);font:400 1rem var(--display);letter-spacing:.14em}.animation-card small{display:block;margin-top:5px;color:var(--muted)}svg{width:100%;height:auto;overflow:visible}.cue{transform-origin:124px 145px;animation:cue-breathe 1.35s ease-in-out both}.chalk{transform-origin:center;animation:chalk-rub 1.35s ease-in-out both}.chalk-dust circle{opacity:0;animation:dust 1.35s ease-out both}.chalk-dust circle:nth-child(2){animation-delay:.08s}.chalk-dust circle:nth-child(3){animation-delay:.16s}.shine{opacity:0;animation:shine .35s 1.05s ease-out forwards}@keyframes chalk-rub{0%{transform:translate(32px,-20px) rotate(8deg)}18%{transform:translate(2px,2px) rotate(-4deg)}38%{transform:translate(18px,-2px) rotate(5deg)}58%{transform:translate(1px,3px) rotate(-4deg)}78%{transform:translate(15px,-1px) rotate(4deg)}100%{transform:translate(29px,-22px) rotate(8deg)}}@keyframes cue-breathe{0%,100%{transform:rotate(-1deg)}45%,65%{transform:rotate(1deg)}}@keyframes dust{0%,22%{opacity:0;transform:translate(0,0)}45%{opacity:.9}100%{opacity:0;transform:translate(-20px,-25px)}}@keyframes shine{0%{opacity:0;transform:scale(.4) rotate(0)}55%{opacity:1}100%{opacity:0;transform:scale(1.25) rotate(35deg)}}@media(prefers-reduced-motion:reduce){.chalk,.cue,.chalk-dust circle,.shine{animation-duration:.01ms!important}}
  </style>
</head>
<body><main><p class="kicker">DELIGHT LAB · V1</p><h1 class="title">Chalk the Cue</h1><p class="intro">Tap Start Series to preview the quick transition animation.</p><section class="demo"><label>Series name<input value="Craft Cup"></label><label>Prize<input value="Loser makes the winner a craft"></label><button class="start" id="start">START SERIES</button></section></main><div class="stage" id="stage"><div class="animation-card"><svg viewBox="0 0 360 235" role="img" aria-label="A pool cue being rubbed with chalk"><g class="cue"><path d="M28 190 L119 139" stroke="#f4d8a1" stroke-width="20" stroke-linecap="round"/><path d="M28 190 L119 139" stroke="#bd7640" stroke-width="12" stroke-linecap="round"/><path d="M119 139 L258 61" stroke="#f7e7c2" stroke-width="12" stroke-linecap="round"/><path d="M255 63 L274 52" stroke="#63edf0" stroke-width="13" stroke-linecap="round"/><path d="M270 55 L279 50" stroke="#17333a" stroke-width="14" stroke-linecap="round"/></g><g class="chalk" transform="translate(29 -22)"><rect x="246" y="17" width="57" height="50" rx="8" fill="#174d58"/><path d="M246 29h57v38h-57z" fill="#2db4be"/><ellipse cx="274.5" cy="27" rx="20" ry="8" fill="#63edf0"/><ellipse cx="274.5" cy="29" rx="10" ry="4" fill="#183b43"/></g><g class="chalk-dust" fill="#63edf0"><circle cx="263" cy="66" r="3"/><circle cx="276" cy="72" r="2.5"/><circle cx="286" cy="63" r="2"/></g><g class="shine" fill="#fff1c9" transform-origin="279px 50px"><path d="M279 33l3 11 11 3-11 3-3 11-3-11-11-3 11-3z"/></g></svg><p>RACK 'EM UP</p><small>Getting Craft Cup ready…</small></div></div><script>const stage=document.querySelector('#stage');document.querySelector('#start').onclick=()=>{stage.classList.remove('playing');void stage.offsetWidth;stage.classList.add('playing');setTimeout(()=>stage.classList.remove('playing'),1750)};</script></body>
</html>
