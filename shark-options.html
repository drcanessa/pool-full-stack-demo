<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shark options</title>
<style>
:root{--bg:#071014;--panel:#0b1b21;--cyan:#63edf0;--cream:#fff1c9;--coral:#ff6b4f;--muted:#91a9ad}*{box-sizing:border-box}body{margin:0;padding:26px 18px 40px;background:radial-gradient(circle at 20% 0,#153b43,transparent 34%),var(--bg);color:var(--cream);font-family:"Avenir Next",sans-serif}main{width:min(100%,620px);margin:auto}h1{margin:0 0 6px;font-family:Impact,sans-serif;letter-spacing:.05em;font-weight:400}.intro{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:2px solid #28525a;background:var(--panel);padding:12px;text-align:center;box-shadow:4px 4px #020607}.card:last-child{grid-column:1/-1;width:calc(50% - 6px);justify-self:center}.icon{height:150px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(99,237,240,.06),rgba(239,63,53,.06))}.icon img{width:145px;height:145px;object-fit:contain;image-rendering:pixelated}.num{display:inline-grid;place-items:center;width:28px;height:28px;margin-top:10px;border-radius:50%;background:var(--coral);font-weight:900}.card h2{margin:7px 0 2px;font:400 1rem Impact,sans-serif;letter-spacing:.04em}.card p{margin:0;color:var(--muted);font-size:.72rem}@media(max-width:430px){.icon{height:120px}.icon img{width:118px;height:118px}}
</style></head><body><main><h1>SHARK SELECT</h1><p class="intro">Shown large for choosing—each one will be tiny in the nav.</p><div class="grid">
<article class="card"><div class="icon"><img src="/assets/concepts/shark-option-1.png" alt="Shark option 1"></div><span class="num">1</span><h2>Cool classic</h2><p>Relaxed shades</p></article>
<article class="card"><div class="icon"><img src="/assets/concepts/shark-option-2.png" alt="Shark option 2"></div><span class="num">2</span><h2>Pool hustler</h2><p>Tiny tooth + smirk</p></article>
<article class="card"><div class="icon"><img src="/assets/concepts/shark-option-3.png" alt="Shark option 3"></div><span class="num">3</span><h2>Happy mascot</h2><p>Rounder and friendly</p></article>
<article class="card"><div class="icon"><img src="/assets/concepts/shark-option-4.png" alt="Shark option 4"></div><span class="num">4</span><h2>Just sharky A</h2><p>Faceless swimmer</p></article>
<article class="card"><div class="icon"><img src="/assets/concepts/shark-option-5.png" alt="Shark option 5"></div><span class="num">5</span><h2>Just sharky B</h2><p>Minimal silhouette</p></article>
</div></main></body></html>
